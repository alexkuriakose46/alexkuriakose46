<svg
  width="350"
  height="195"
  viewBox="0 0 350 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Alex Kuriakose's GitHub Stats</title>
  <desc id="descId">Total Contributions: 11,687, Total Commits: 11,544, Total Stars: 1, Repositories: 6</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #00d4ff;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #c9d1d9;
    }
    .stat-val {
      font: 700 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #00d4ff;
    }
    .bold { font-weight: 700; }
    .icon {
      fill: #00d4ff;
      display: block;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="12"
    height="99%"
    stroke="#00d4ff"
    width="349"
    fill="#0d1117"
    stroke-opacity="1"
    stroke-width="1.5"
  />

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Alex Kuriakose's GitHub Stats</text>
  </g>

  <g transform="translate(0, 55)">
    <!-- Total Contributions -->
    <g class="stagger" style="animation-delay: 450ms" transform="translate(25, 0)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M1.643 3.143L.427 1.927A.25.25 0 000 2.104V5.75c0 .138.112.25.25.25h3.646a.25.25 0 00.177-.427L2.715 4.215a6.5 6.5 0 11-1.18 4.458.75.75 0 10-1.493.154 8.001 8.001 0 101.6-5.684zM7.75 4a.75.75 0 01.75.75v2.992l2.028.812a.75.75 0 01-.557 1.392l-2.5-1A.75.75 0 017 8.25v-3.5A.75.75 0 017.75 4z"/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Total Contributions:</text>
      <text class="stat-val" x="245" y="12.5">11,687</text>
    </g>

    <!-- Total Commits -->
    <g class="stagger" style="animation-delay: 600ms" transform="translate(25, 26)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M10.5 7.75a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zm1.43.75a4.002 4.002 0 01-7.86 0H.75a.75.75 0 110-1.5h3.32a4.002 4.002 0 017.86 0h3.32a.75.75 0 110 1.5h-3.32z"/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Total Commits:</text>
      <text class="stat-val" x="245" y="12.5">11,544</text>
    </g>

