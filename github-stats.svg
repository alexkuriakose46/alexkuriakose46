      <text class="stat-val" x="245" y="12.5">6</text>
    </g>

    <!-- Contribution Streak -->
    <g class="stagger" style="animation-delay: 1050ms" transform="translate(25, 104)">
      <svg class="icon" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M8.5 1.5a.75.75 0 00-1 0c-1.397 1.4-2.5 3.25-2.5 5 0 2.21 1.79 4 4 4s4-1.79 4-4c0-1.75-1.103-3.6-2.5-5a.75.75 0 00-1 0zM8 8.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
      </svg>
      <text class="stat bold" x="25" y="12.5">Contribution Streak:</text>
      <text class="stat-val" x="245" y="12.5">11 Days</text>
    </g>
  </g>
</svg>